<ellipse cx="200" cy="200" rx="50" ry="63" fill="url(#kh)"/>
<g clip-path="url(#hole)" fill="#3A3428" font-family="'Noto Serif SC','Songti SC','SimSun',serif" font-size="19" text-anchor="middle"><g opacity="0.28"><text x="232" y="140">有</text><text x="232" y="161">朋</text><text x="232" y="182">自</text><text x="232" y="203">远</text><text x="232" y="224">方</text><text x="232" y="245">来</text></g><g opacity="0.85"><text x="200" y="150">人</text><text x="200" y="171">不</text><text x="200" y="192">知</text><text x="200" y="213">而</text><text x="200" y="234">不</text><text x="200" y="255">愠</text></g><g opacity="0.28"><text x="168" y="140">不</text><text x="168" y="161">亦</text><text x="168" y="182">君</text><text x="168" y="203">子</text><text x="168" y="224">乎</text></g></g>
<ellipse cx="200" cy="200" rx="50" ry="63" fill="none" stroke="#7A6A4E" stroke-width="2.5"/>
<ellipse cx="200" cy="202" rx="47" ry="60" fill="none" stroke="#000" stroke-opacity=".12" stroke-width="6"/>
